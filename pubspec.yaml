name: nihonkoe
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.4
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  html: ^0.15.7
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  local_auth_platform_interface: ^1.1.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

# Launcher icon and splash: the 声 logo in sakura (same artwork as the Expo app).
# Regenerate with `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/android-icon-foreground.png
  adaptive_icon_monochrome: assets/brand/android-icon-monochrome.png
  # The Expo artwork already carries its safe-zone padding.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash-icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash-icon.png
  ios: false
  web: false
